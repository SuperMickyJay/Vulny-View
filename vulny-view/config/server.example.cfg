; Template for the online server address used by the "Play Online" button.
;
; Copy this file to `server.cfg` (same folder) and put your dedicated server's public
; IP or hostname in it. `server.cfg` is gitignored so the address never lands in the
; repo; the Android export preset packs it into builds via its include_filter.
; If it's missing, Play Online shows "Online server not configured" instead.

[server]

address="203.0.113.10"
